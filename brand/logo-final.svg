<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-label="INTERRUPT — WE INTERRUPT THIS FEED">
  <!-- ============================================================
       INTERRUPT — FINAL lockup (clean rebuild of the AI concept)
       Direction: torn reveal -> static (left) + color bars (right)
       Tagline: WE INTERRUPT THIS FEED
       ------------------------------------------------------------
       Text uses system fonts (Impact / Arial Black). For the final
       production file, rebuild the wordmark in Canva/Figma with
       Archivo Black and replace this text with outlined paths.
       The AI concept images should NOT be used directly - their
       letterforms are malformed. Generate the tear texture with AI,
       then composite REAL type on top.
       ============================================================ -->
  <defs>
    <filter id="torn" x="-6%" y="-60%" width="112%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.13" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="static" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="s"/>
      <feColorMatrix in="s" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="#0B0B0C"/>

  <!-- registration marks (top right) -->
  <line x1="1400" y1="40" x2="1400" y2="110" stroke="#EFE9DC" stroke-width="2" opacity="0.5"/>
  <line x1="1400" y1="110" x2="1510" y2="110" stroke="#EFE9DC" stroke-width="2" opacity="0.5"/>

  <!-- wordmark (real type - rebuild with Archivo Black for production) -->
  <text x="800" y="310" text-anchor="middle"
        font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
        font-size="215" font-weight="900" letter-spacing="4" fill="#EFE9DC">INTERRUPT</text>

  <!-- torn reveal band: static (left) -> color bars (right) -->
  <g filter="url(#torn)">
    <rect x="26" y="206" width="794" height="70" filter="url(#static)"/>
    <rect x="826"  y="206" width="124" height="70" fill="#EFE9DC"/>
    <rect x="950"  y="206" width="124" height="70" fill="#FFC400"/>
    <rect x="1074" y="206" width="124" height="70" fill="#FF3B00"/>
    <rect x="1198" y="206" width="124" height="70" fill="#1FA97A"/>
    <rect x="1322" y="206" width="124" height="70" fill="#2D6CDF"/>
    <rect x="1446" y="206" width="128" height="70" fill="#0B0B0C"/>
  </g>

  <!-- tagline -->
  <text x="800" y="412" text-anchor="middle"
        font-family="'IBM Plex Mono', Consolas, monospace"
        font-size="33" letter-spacing="15" fill="#EFE9DC">WE INTERRUPT THIS FEED</text>

  <!-- footer bars -->
  <g>
    <rect x="0" y="474" width="267" height="26" fill="#EFE9DC"/>
    <rect x="267" y="474" width="267" height="26" fill="#FFC400"/>
    <rect x="534" y="474" width="266" height="26" fill="#FF3B00"/>
    <rect x="800" y="474" width="266" height="26" fill="#1FA97A"/>
    <rect x="1066" y="474" width="266" height="26" fill="#2D6CDF"/>
    <rect x="1332" y="474" width="268" height="26" fill="#0B0B0C"/>
  </g>
</svg>
