<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-label="INTERRUPT">
  <!-- ============================================================
       INTERRUPT — primary wordmark (starting point)
       Concept: a broadcast signal sliced by a tracking tear.
       NOTE: text uses system fonts (Impact / Arial Black). Rebuild the
       wordmark in Canva/Figma with Archivo Black for the final version,
       then replace this text with outlined paths.
       ============================================================ -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="#0B0B0C"/>

  <!-- wordmark -->
  <text x="800" y="308" text-anchor="middle"
        font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
        font-size="210" font-weight="900" letter-spacing="6" fill="#EFE9DC">INTERRUPT</text>

  <!-- tracking tear: full-width color-bar slice, offset to read as a misregistration -->
  <g transform="translate(14,0)">
    <rect x="-20" y="214" width="1640" height="52" fill="#0B0B0C"/>
    <rect x="-20"  y="214" width="274" height="52" fill="#EFE9DC"/>
    <rect x="254"  y="214" width="274" height="52" fill="#FFC400"/>
    <rect x="528"  y="214" width="274" height="52" fill="#FF3B00"/>
    <rect x="802"  y="214" width="274" height="52" fill="#1FA97A"/>
    <rect x="1076" y="214" width="274" height="52" fill="#2D6CDF"/>
    <rect x="1350" y="214" width="270" height="52" fill="#0B0B0C"/>
    <rect x="-20" y="214" width="1640" height="52" fill="url(#none)" filter="url(#grain)" opacity="0.5"/>
  </g>
  <line x1="0" y1="213" x2="1600" y2="213" stroke="#EFE9DC" stroke-width="1.5" opacity="0.6"/>
  <line x1="0" y1="267" x2="1600" y2="267" stroke="#EFE9DC" stroke-width="1.5" opacity="0.6"/>

  <!-- tagline -->
  <text x="800" y="412" text-anchor="middle"
        font-family="'IBM Plex Mono', Consolas, monospace"
        font-size="32" letter-spacing="16" fill="#EFE9DC">WE INTERRUPT THIS FEED</text>

  <!-- footer bars -->
  <g>
    <rect x="0" y="474" width="267" height="26" fill="#EFE9DC"/>
    <rect x="267" y="474" width="267" height="26" fill="#FFC400"/>
    <rect x="534" y="474" width="266" height="26" fill="#FF3B00"/>
    <rect x="800" y="474" width="266" height="26" fill="#1FA97A"/>
    <rect x="1066" y="474" width="266" height="26" fill="#2D6CDF"/>
    <rect x="1332" y="474" width="268" height="26" fill="#0B0B0C"/>
  </g>
</svg>
